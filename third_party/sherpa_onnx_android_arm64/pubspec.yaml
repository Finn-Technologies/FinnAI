name: sherpa_onnx_android_arm64

description: >
  FinnAI's build of the sherpa-onnx Android arm64-v8a native libraries: speech
  recognition only. Text-to-speech is compiled out (SHERPA_ONNX_ENABLE_TTS=OFF),
  which removes the GPL-3.0 espeak-ng phonemizer that the upstream binary links.
  See tool/rebuild_sherpa_android.sh and docs/decisions/0008-licence-clean-voice.md.

version: 1.13.8

repository: https://github.com/k2-fsa/sherpa-onnx/tree/master/flutter

issue_tracker: https://github.com/k2-fsa/sherpa-onnx/issues
documentation: https://k2-fsa.github.io/sherpa/onnx/

homepage: https://github.com/k2-fsa/sherpa-onnx

topics:
  - speech-recognition
  - speech-synthesis
  - speaker-identification
  - audio-tagging
  - voice-activity-detection

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=2.8.1"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
