name: FinnAI CI & Release Verification

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  analyze_and_test:
    name: Flutter Format, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Inspect Packaged Runtime Assets
        run: |
          ls -la assets/runtime/*.svg
          test $(ls -1 assets/runtime/*.svg | wc -l) -ge 20

  verify_release_build:
    name: Verify Release APK, AAB & 16 KB Native Alignment Gate
    runs-on: ubuntu-latest
    needs: analyze_and_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Temporary Release Signing Configuration for CI
        run: |
          keytool -genkey -v -keystore android/release-ci.jks \
            -keyalg RSA -keysize 2048 -validity 1 \
            -alias finn_ci_alias -dname "CN=CI, OU=FinnAI, O=FinnAI, L=SF, S=CA, C=US" \
            -storepass cipassword -keypass cipassword

          cat <<EOF > android/key.properties
          storePassword=cipassword
          keyPassword=cipassword
          keyAlias=finn_ci_alias
          storeFile=release-ci.jks
          EOF

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Verify zipalign 16 KB Boundary on Release APK
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign
          zipalign -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk

      - name: Verify 16 KB Page Alignment of Native Libraries (Fail on 4 KB)
        run: |
          sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu unzip
          unzip -q android/app/libs/llama-cpp-dart.aar -d /tmp/aar_extract
          for file in /tmp/aar_extract/jni/arm64-v8a/*.so; do
            echo "Checking $file..."
            align=$(aarch64-linux-gnu-readelf -l "$file" | grep LOAD | head -n 1 | awk '{print $NF}')
            echo "Library $file alignment: $align"
            if [ "$align" != "0x4000" ] && [ "$align" != "4000" ] && [ "$align" != "0x10000" ]; then
              echo "BLOCKER: $file has 4 KB alignment ($align). Android 15 requires 16 KB (0x4000)."
              exit 1
            fi
          done

      - name: Cleanup Temporary Signing Keys
        if: always()
        run: |
          rm -rf android/release-ci.jks android/key.properties
