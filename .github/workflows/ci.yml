name: FinnAI CI & Release Verification

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze_and_test:
    name: Flutter Format, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          # Pinned stable for reproducible CI. Verify this is still a real
          # current release (and find the next pin) at
          # https://docs.flutter.dev/release/archive before bumping.
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify Engine Seam
        run: bash tool/verify_engine_seam.sh

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests with Coverage
        run: flutter test --coverage

      - name: Run Shell Cleanup Tests
        run: bash test/shell/test_cleanup.sh

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  verify_release_build:
    name: Verify Release APK, AAB & 16 KB Native Alignment Gate
    runs-on: ubuntu-latest
    needs: analyze_and_test
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          # Pinned stable for reproducible CI. Verify this is still a real
          # current release (and find the next pin) at
          # https://docs.flutter.dev/release/archive before bumping.
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Temporary Release Signing Configuration for CI
        run: |
          keytool -genkey -v -keystore android/app/release-ci.jks \
            -keyalg RSA -keysize 2048 -validity 1 \
            -alias finn_ci_alias -dname "CN=CI, OU=FinnAI, O=FinnAI, L=SF, S=CA, C=US" \
            -storepass cipassword -keypass cipassword

          cat <<EOF > android/key.properties
          storePassword=cipassword
          keyPassword=cipassword
          keyAlias=finn_ci_alias
          storeFile=release-ci.jks
          EOF

      - name: Build Release APK
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=FINN_SUPPORT_EMAIL=ci@example.invalid \
            --dart-define=FINN_SUPPORT_URL=https://example.invalid/support \
            --dart-define=FINN_PRIVACY_POLICY_URL=https://example.invalid/privacy \
            --dart-define=FINN_TERMS_URL=https://example.invalid/terms \
            --dart-define=FINN_REPORT_EMAIL=ci@example.invalid

      - name: Build Release Android App Bundle (AAB)
        run: |
          flutter build appbundle --release --target-platform android-arm64 \
            --dart-define=FINN_SUPPORT_EMAIL=ci@example.invalid \
            --dart-define=FINN_SUPPORT_URL=https://example.invalid/support \
            --dart-define=FINN_PRIVACY_POLICY_URL=https://example.invalid/privacy \
            --dart-define=FINN_TERMS_URL=https://example.invalid/terms \
            --dart-define=FINN_REPORT_EMAIL=ci@example.invalid

      - name: Verify ARM64-only packaging
        run: |
          unzip -Z1 build/app/outputs/flutter-apk/app-release.apk |
            awk -F/ '/^lib\// {print $2}' | sort -u |
            diff -u <(printf 'arm64-v8a\n') -
          unzip -Z1 build/app/outputs/bundle/release/app-release.aab |
            awk -F/ '/^base\/lib\// {print $3}' | sort -u |
            diff -u <(printf 'arm64-v8a\n') -

      - name: Verify zipalign 16 KB Boundary on Release APK
        run: |
          zipalign_path=$(find "$ANDROID_HOME/build-tools" -mindepth 2 \
            -maxdepth 2 -name zipalign -type f | sort -V | tail -1)
          test -n "$zipalign_path"
          "$zipalign_path" -c -P 16 -v 4 \
            build/app/outputs/flutter-apk/app-release.apk

      # Shared verifier for every shipped artifact: AAR-embedded native
      # libraries plus the packaged APK and AAB. ubuntu-latest runners ship
      # python3 and unzip preinstalled.
      - name: Verify 16 KB Page Alignment of Native Libraries (Fail on 4 KB)
        run: |
          python3 tool/verify_native_alignment.py android/app/libs/llama-cpp-dart.aar
          python3 tool/verify_native_alignment.py build/app/outputs/flutter-apk/app-release.apk
          python3 tool/verify_native_alignment.py build/app/outputs/bundle/release/app-release.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-arm64
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Cleanup Temporary Signing Keys
        if: always()
        run: |
          rm -rf android/app/release-ci.jks android/key.properties
