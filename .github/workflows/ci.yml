name: FinnAI CI & Release Verification

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  analyze_and_test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

  verify_release_build:
    name: Verify Release Android App Bundle (AAB) Build
    runs-on: ubuntu-latest
    needs: analyze_and_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Dummy Release Signing Configuration for CI
        run: |
          keytool -genkey -v -keystore android/release-ci.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias finn_ci_alias -dname "CN=CI, OU=FinnAI, O=FinnAI, L=SF, S=CA, C=US" \
            -storepass cipassword -keypass cipassword

          cat <<EOF > android/key.properties
          storePassword=cipassword
          keyPassword=cipassword
          keyAlias=finn_ci_alias
          storeFile=release-ci.jks
          EOF

      - name: Verify 16 KB Page Alignment of Native Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu unzip
          unzip -q android/app/libs/llama-cpp-dart.aar -d /tmp/aar_extract
          for file in /tmp/aar_extract/jni/arm64-v8a/*.so; do
            echo "Checking $file..."
            aarch64-linux-gnu-readelf -l "$file" | grep -A 1 LOAD
          done

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Verify Output AAB Artifact
        run: |
          ls -la build/app/outputs/bundle/release/app-release.aab
          test -f build/app/outputs/bundle/release/app-release.aab
