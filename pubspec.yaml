name: finn_ai
description: "A private, on-device AI assistant for Android, OpenHarmony and desktop Linux."
publish_to: 'none'

version: 2.0.0-beta+10

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <0.22.0"
  cupertino_icons: ^1.0.9
  crypto: ^3.0.7
  archive: ^4.0.7
  flutter_svg: ">=2.0.0 <3.0.0"
  html: ^0.15.6
  xml: ^6.5.0
  hugeicons: ^1.1.7
  llama_cpp_dart:
    path: third_party/llama_cpp_dart
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.2
  package_info_plus: ^9.0.1
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  url_launcher: ^6.3.1
  http: ^1.2.2
  image_picker: ^1.2.3
  file_picker: ^11.0.3
  flutter_tts: ^4.2.5
  sherpa_onnx: ^1.13.8
  record: ^6.2.1
  flutter_pcm_sound: ^3.3.3
  ffi: ^2.2.0
  # Upstream for Android and iOS; OpenHarmony gets the SIG's ArkWeb
  # implementation as a direct dependency (a federated plugin can be added
  # beside the app-facing one). FinnAI Code's Linux container runs in it
  # (ADR 0011). The SIG's own app-facing fork cannot be used: its Android side
  # still uses the v1 embedding Flutter 3.41 removed.
  webview_flutter: ^4.14.1
  webview_flutter_ohos:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: 2f21e26e09efb92b8429c840ae7ca0cb024f036c
      path: packages/webview_flutter/webview_flutter_ohos

dependency_overrides:
  # webview_flutter_ohos pins a git copy of the platform interface (2.10);
  # upstream webview_flutter needs ^2.15. The interface only grew, so the
  # OpenHarmony implementation runs against the upstream one.
  webview_flutter_platform_interface: ^2.15.1
  # Upstream's prebuilt libsherpa-onnx-c-api.so links espeak-ng (GPL-3.0). This
  # copy is built from the same source with TTS compiled out.
  sherpa_onnx_android_arm64:
    path: third_party/sherpa_onnx_android_arm64

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf

  assets:
    - assets/icon/
    - assets/runtime/
    - assets/code_container/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
