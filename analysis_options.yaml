# FinnAI Engine seam — build decoupling (Track 5, Phase 1)
#
# ONLY `lib/src/engine/backends/` may import `package:llama_cpp_dart`.
# All other files in `lib/src/engine` must depend on the engine-owned seam
# `lib/src/engine/api/engine_api.dart` and the shim
# `lib/src/engine/backends/llama_shim.dart` is transitional only.
# Enforcement is via `tool/verify_engine_seam.sh` (CI) which runs:
#   ! grep -r "package:llama_cpp_dart" lib/src/engine --include="*.dart" | grep -v "lib/src/engine/backends/"
# and via the `depend_on_referenced_packages` + custom lint in a future
# analyzer plugin. New engine code that directly imports `llama_cpp_dart`
# outside `backends/` will be rejected in review and blocked by CI.
#
# See docs/ENGINE_API.md and docs/ENGINE_ROADMAP.md for the 12-month runway.

# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_use_of_visible_for_testing_member: ignore
  exclude:
    - third_party/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    use_build_context_synchronously: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
